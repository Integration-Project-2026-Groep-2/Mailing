name: Build & Deploy Image to Dev

on:
    workflow_run:
        workflows: [CI]
        types:
            - completed

env:
    SERVICE_NAME: mailing_app
    IMAGE: ghcr.io/integration-project-2026-groep-2/mailing

jobs:
    build-and-push:
        if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
        runs-on: ubuntu-latest
        outputs:
          image_tag: ${{ steps.image_meta.outputs.image_tag }}
        permissions:
            contents: read
            packages: write
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: ${{ github.event.workflow_run.head_sha }}

            - name: Compute image tag
              id: image_meta
              run: echo "image_tag=sha-${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

            - name: Log in to registry
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Build image
              run: |
                docker build -t ${{ env.IMAGE }}:${{ steps.image_meta.outputs.image_tag }} .
                docker tag ${{ env.IMAGE }}:${{ steps.image_meta.outputs.image_tag }} ${{ env.IMAGE }}:latest-dev

            - name: Push tags
              run: |
                docker push ${{ env.IMAGE }}:${{ steps.image_meta.outputs.image_tag }}
                docker push ${{ env.IMAGE }}:latest-dev

    trigger-k8s-manifest-update:
        name: Trigger Manifest Repo Update
        runs-on: ubuntu-latest
        needs: build-and-push

        steps:
          - name: Dispatch to k8s-manifests repo
            uses: peter-evans/repository-dispatch@v3
            with:
              token: ${{ secrets.MANIFESTS_REPO_PAT }}
              repository: integration-project-2026-groep-2/k8s-manifests
              event-type: update-dev-image
              client-payload: |
                {
                  "image": "${{ env.IMAGE }}",
                  "tag": "${{ needs.build-and-push.outputs.image_tag }}",
                  "service": "${{ github.event.repository.name }}",
                  "commit": "${{ github.sha }}",
                  "actor": "${{ github.actor }}"
                }
